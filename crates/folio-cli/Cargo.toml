[package]
name = "folio-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[[bin]]
name = "folio-core"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
folio-core = { path = "../folio-core" }
rpassword = "7"
serde_json = "1"
zeroize = "1"
