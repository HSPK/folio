name: Build shared core and wrappers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: build/rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Select Rust stable
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Restore shared web dependencies
        working-directory: web
        run: npm ci
      - name: Install test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build and test shared web assets
        working-directory: web
        run: |
          npm run build
          npm run check:lines
          npm test
      - name: Test shared core and platform adapters
        run: cargo test --locked --workspace
      - name: Build headless core
        run: cargo build --locked -p folio-cli
      - name: Test native link selection
        working-directory: web
        run: npx playwright test --grep "link selection stays native" --output test-results-native
      - name: Test browser editor against core CLI
        working-directory: web
        run: npx playwright test
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: folio-browser-${{ runner.os }}
          path: |
            web/test-results
            web/test-results-native
          if-no-files-found: ignore
          retention-days: 7
      - name: Build Windows wrapper
        if: runner.os == 'Windows'
        run: .\apps\windows\Scripts\build.ps1 -Runtime win-x64 -Toolchain msvc
      - name: Build macOS wrapper and archive application
        if: runner.os == 'macOS'
        run: |
          zsh apps/macos/Scripts/build.sh
          tar -czf build/Folio-macOS.tar.gz -C build Folio.app
      - name: Build Linux CLI archive
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release -p folio-cli
          tar -czf build/folio-core-linux.tar.gz -C build/rust/release folio-core
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ runner.os }}
          if-no-files-found: error
          path: |
            build/windows/win-x64/Folio.exe
            build/Folio-macOS.tar.gz
            build/folio-core-linux.tar.gz
