name: Bug report / 问题反馈
description: Report a reproducible problem with Folio / 反馈可复现的问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese are welcome. Use a minimal, synthetic example.
        请使用最小示例，不要上传真实笔记、密码、token 或账户数据库。
  - type: input
    id: version
    attributes:
      label: Folio version / 版本
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture and browser / 系统、架构与浏览器
      placeholder: "Windows 11 x64, Edge / macOS ARM64, Chrome / Linux x64, Firefox"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include the editor view and a small Markdown example when relevant.
      placeholder: "1. Open a note in Live view..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized logs / 截图或脱敏日志
      description: Remove personal paths, credentials and private content before sharing.
